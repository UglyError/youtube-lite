# YouTube Lite - low-power playback profile
# Goal: let the GPU's fixed-function video decoder do all the work,
# and keep the shader/render pipeline as cheap as possible.

# ---- Stream choice: 1080p, 30fps, H.264 ----
# H.264 (avc1) is hardware-decoded by virtually every GPU made since ~2010.
# VP9/AV1 are only hardware-decoded on newer GPUs; on older ones they fall
# back to the CPU and burn a lot of power, so H.264 is preferred.
# Order of preference:
#   1. 1080p, <=30fps, H.264
#   2. 1080p, <=30fps, any codec
#   3. 1080p (60fps-only videos - YouTube has no 30fps copy of those), H.264
#   4. best available up to 1080p
ytdl-format=bv*[height<=1080][fps<=30][vcodec^=avc1]+ba[acodec^=mp4a]/bv*[height<=1080][fps<=30][vcodec^=avc1]+ba/bv*[height<=1080][fps<=30]+ba/bv*[height<=1080][vcodec^=avc1]+ba/bv*[height<=1080]+ba/b[height<=1080]/b
ytdl-raw-options=format-sort=[res:1080,fps:30,vcodec:h264,acodec:aac]
script-opts=ytdl_hook-ytdl_path=yt-dlp.exe

# ---- Hardware decoding (zero-copy, the big power saver) ----
hwdec=d3d11va,auto-safe
vo=gpu
gpu-api=d3d11
gpu-context=d3d11

# ---- Cheap rendering: skip expensive shaders/filters ----
profile=fast
scale=bilinear
dscale=bilinear
cscale=bilinear
dither-depth=no
deband=no
interpolation=no
video-sync=audio
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no
hdr-compute-peak=no

# ---- Smooth streaming with modest memory use ----
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
demuxer-readahead-secs=30

# ---- Window / UI ----
keep-open=no
force-window=immediate
autofit-larger=90%x90%
title=${media-title} - YouTube Lite
osd-bar=yes
screenshot-directory=~~desktop/
volume=100
volume-max=150
save-position-on-quit=yes
