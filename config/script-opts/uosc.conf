# Playback controls for YouTube Lite (uosc: https://github.com/tomasklaen/uosc)
# Quality switching is left out on purpose: the 1080p/30fps H.264 choice is what keeps power use low.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
timeline_style=bar
timeline_persistency=paused
controls_persistency=paused
volume=right
top_bar=no-border
autoload=no
