name: Build release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: ./scripts/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: YouTube Lite ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            Download **YouTubeLite.zip**, unzip it, and run `YouTubeLite.exe` (Windows 10/11, 64-bit).

            Plays YouTube at 1080p/30fps with H.264 hardware decoding for minimal CPU and power use. Bundles the latest mpv and yt-dlp (yt-dlp keeps itself updated).
          files: dist/YouTubeLite.zip
